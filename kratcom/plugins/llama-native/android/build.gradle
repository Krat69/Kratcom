ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "es.cratias.kratcom.llama"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36

    defaultConfig {
        minSdk project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 26

        // Solo arm64. Un dispositivo de 32 bits no mueve un modelo de 1 GB, y
        // compilar llama.cpp para armeabi-v7a duplicaría el tiempo de build a
        // cambio de una variante que nadie va a usar.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release'
                cppFlags '-O3', '-fexceptions', '-frtti'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

repositories {
    google()
    mavenCentral()
    // El proyecto de la app resuelve @capacitor/android desde node_modules.
    flatDir { dirs "$rootDir/../node_modules/@capacitor/android/capacitor/build/outputs/aar" }
}

dependencies {
    implementation project(':capacitor-android')
}
