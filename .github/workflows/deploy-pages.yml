name: Desplegar en GitHub Pages

# Solo desde la rama por defecto, y por dos razones:
#
#   1. El entorno github-pages tiene la protección estándar que rechaza
#      cualquier otra rama, así que un disparador de rama es un fallo
#      garantizado (histórico: todo lo lanzado desde main pasa, todo lo
#      lanzado desde una rama falla en dos segundos y sin logs).
#   2. Aunque se levantara esa protección, publicar una rama en Pages
#      sobrescribiría el sitio en producción con código sin revisar.
#
# Las vistas previas por rama ya las genera Vercel en cada pull request.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kratcom/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: kratcom

      - name: Compilar
        run: npm run build
        working-directory: kratcom
        env:
          BASE_PATH: /Kratcom/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kratcom/dist

      - id: deployment
        uses: actions/deploy-pages@v4
